name: Tracker audit

# Weekly report-only hygiene audit of this repository's issue tracker, from ginsys/.github. Checks
# follow AGENTS.md: every open issue has a milestone and exactly one `type/` label; `status/`
# in-progress and needs-review never coexist; nothing is in progress while blocked by an open
# native dependency. It only reports; fixing the tracker is a triage action.

on:
  schedule:
    - cron: '45 6 * * 1'  # Mondays 06:45 UTC, after ginsys/.github's own audits
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  audit:
    uses: ginsys/.github/.github/workflows/tracker-audit.yml@main
    with:
      require-milestone: true
      single-select: type
      exclusive: "status/in-progress:status/needs-review"
      blocked-in-progress: true
